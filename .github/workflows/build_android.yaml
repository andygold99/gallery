  name: Build Android APK
  
  on:
    workflow_dispatch:
    push:
      branches: [ "main" ]
      paths:
        - 'Android/**'
    pull_request:
      branches: [ "main" ]
      paths:
        - 'Android/**'
  
  jobs:
    build_apk:
      name: Build Android APK
      runs-on: ubuntu-latest
      defaults:
        run:
          working-directory: ./Android/src
      steps:
        - name: Checkout the source code
          uses: actions/checkout@v3
        - uses: actions/setup-java@v4
          with:
            distribution: 'temurin'
            java-version: '21'
        - name: Install Android SDK Platform 37
          run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
        - name: Restore signing keystore
          env:
            ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
        - name: Build
          env:
            ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
            ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          run: ./gradlew assembleRelease
        - name: Upload APK
          uses: actions/upload-artifact@v4
          with:
            name: ai-edge-gallery-apk
            path: Android/src/app/build/outputs/apk/release/*.apk
  
  
